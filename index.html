<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>STACKER</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #10141f;
    font-family: 'Avenir Next', 'Pretendard', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  #wrap { position: relative; width: 100%; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }

  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 24px 28px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
    color: #eef1f8;
  }
  #score {
    font-size: 64px; font-weight: 700; line-height: 1;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 24px rgba(0,0,0,.35);
    transition: transform .12s ease-out;
  }
  #score.pop { transform: scale(1.18); }
  #hudRight { text-align: right; }
  #best {
    font-size: 15px; font-weight: 500;
    color: rgba(238,241,248,.55);
    line-height: 1.5;
  }
  #best strong { display: block; font-size: 24px; color: #eef1f8; font-variant-numeric: tabular-nums; }
  #bestDiff { font-size: 11px; font-weight: 800; letter-spacing: .12em; }
  #bestName {
    display: block; font-size: 13px; color: rgba(238,241,248,.7);
    margin-top: 2px; max-width: 150px; margin-left: auto;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #muteBtn {
    margin-top: 12px;
    pointer-events: auto;
    background: rgba(238,241,248,.12); border: none; color: #eef1f8;
    width: 44px; height: 44px; border-radius: 12px;
    font-size: 20px; cursor: pointer;
    backdrop-filter: blur(4px);
  }
  #muteBtn:active { transform: scale(.94); }

  #combo {
    position: absolute; left: 50%; top: 22%;
    transform: translateX(-50%) scale(.6);
    font-size: 26px; font-weight: 700; color: #ffe27a;
    opacity: 0; pointer-events: none;
    text-shadow: 0 2px 16px rgba(255,190,60,.5);
  }
  #combo.show { animation: comboPop .7s ease-out; }
  @keyframes comboPop {
    0%   { opacity: 0; transform: translateX(-50%) scale(.6); }
    20%  { opacity: 1; transform: translateX(-50%) scale(1.15); }
    45%  { transform: translateX(-50%) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-26px) scale(1); }
  }

  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; color: #eef1f8; pointer-events: none;
    /* visibility 는 즉시 켜고(보일 때), 끌 때만 페이드가 끝난 뒤 넘긴다 */
    transition: opacity .25s, visibility 0s;
    padding: 20px;
  }
  /* opacity 만으로 숨기면 요소가 그대로 살아 있어, 그 위를 누른 탭을 리더보드 탭
     버튼이 먹어버린다(pointer-events: auto + stopPropagation). 화면 한가운데에
     블록이 놓이지 않는 죽은 구간이 생겼다. visibility 로 자식까지 함께 끈다. */
  #overlay.hidden {
    opacity: 0; visibility: hidden;
    transition: opacity .25s, visibility 0s .25s;
  }
  #overlay h1 { font-size: 44px; font-weight: 800; letter-spacing: .04em; text-align: center; }
  #overlay p  { font-size: 16px; color: rgba(238,241,248,.65); text-align: center; }
  #overlay .final { font-size: 78px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  #overlay .tag {
    padding: 10px 22px; border-radius: 999px;
    background: rgba(238,241,248,.12); font-size: 15px;
    backdrop-filter: blur(4px);
  }
  #overlay .newbest { color: #ffe27a; font-weight: 700; font-size: 17px; }

  #board {
    min-width: 250px; max-width: 320px; width: 100%;
    background: rgba(12,16,26,.55); border-radius: 16px;
    padding: 16px 20px; backdrop-filter: blur(6px);
    font-size: 15px;
  }
  #board h2 {
    font-size: 13px; font-weight: 600; color: rgba(238,241,248,.5);
    margin-bottom: 10px; text-align: center; letter-spacing: .12em;
  }
  #board ol { list-style: none; }
  #board li {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 5px 0; gap: 12px;
  }
  #board li .rank { color: rgba(238,241,248,.45); width: 18px; font-variant-numeric: tabular-nums; }
  #board li .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #board li .sc { font-weight: 700; font-variant-numeric: tabular-nums; }
  #board li.me { color: #ffe27a; }
  #board .empty { text-align: center; color: rgba(238,241,248,.4); padding: 8px 0; }

  #entryBox {
    display: none; flex-direction: column; align-items: center; gap: 12px;
    pointer-events: auto;
  }
  #entryBox.show { display: flex; }
  #entryBox input {
    width: 220px; padding: 13px 16px; border-radius: 12px;
    border: 2px solid rgba(238,241,248,.25); background: rgba(12,16,26,.6);
    color: #eef1f8; font-size: 17px; text-align: center; outline: none;
    font-family: inherit;
  }
  #entryBox input:focus { border-color: #ffe27a; }
  #entryBox button {
    padding: 12px 34px; border-radius: 999px; border: none;
    background: #ffe27a; color: #1a1405; font-size: 16px; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
  #entryBox button:active { transform: scale(.96); }

  #hudLeft { display: flex; flex-direction: column; gap: 9px; }

  #diffBadge {
    align-self: flex-start;
    font-size: 11px; font-weight: 800; letter-spacing: .16em;
    padding: 4px 11px; border-radius: 999px;
    background: rgba(238,241,248,.1);
  }

  #scoreHelp {
    font-size: 12px; line-height: 1.65;
    color: rgba(238,241,248,.5);
    background: rgba(12,16,26,.42);
    border-radius: 10px; padding: 8px 12px;
    backdrop-filter: blur(4px);
    width: 176px;
  }
  #scoreHelp .row { display: flex; justify-content: space-between; gap: 12px; }
  #scoreHelp b { font-weight: 700; color: rgba(238,241,248,.82); font-variant-numeric: tabular-nums; }
  #scoreHelp .next {
    margin-top: 5px; padding-top: 5px;
    border-top: 1px solid rgba(238,241,248,.13);
    color: #ffe27a;
  }
  #scoreHelp .next b { color: #ffe27a; }

  /* 시작·게임오버 화면에서는 좌측 점수 패널과 우측 최고 기록을 접는다.
     오버레이 내용(난이도 선택 + 리더보드)이 길어 화면 위쪽까지 올라와 겹친다.
     플레이 중에는 오버레이가 .hidden 이라 그대로 보인다. 음소거 버튼은 남긴다. */
  #wrap:has(#overlay:not(.hidden)) #hudLeft,
  #wrap:has(#overlay:not(.hidden)) #best { opacity: 0; }
  #hudLeft, #best { transition: opacity .2s; }

  #scopeTabs {
    display: flex; gap: 6px; justify-content: center;
    margin-bottom: 10px; pointer-events: auto;
  }
  #scopeTabs button {
    padding: 4px 14px; border-radius: 999px; cursor: pointer;
    border: none; background: transparent;
    color: rgba(238,241,248,.45);
    font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: .1em;
  }
  #scopeTabs button.on { background: rgba(238,241,248,.14); color: #eef1f8; }

  #board li.mine { color: #ffe27a; }
  #board li.myrank {
    margin-top: 6px; padding-top: 9px;
    border-top: 1px solid rgba(238,241,248,.14);
    color: #ffe27a;
  }
  #boardTabs {
    display: flex; gap: 4px; margin-bottom: 10px;
    pointer-events: auto;
  }
  #boardTabs button {
    flex: 1; padding: 5px 2px; border-radius: 8px; cursor: pointer;
    border: none; background: rgba(238,241,248,.07);
    color: rgba(238,241,248,.45);
    font-family: inherit; font-size: 10px; font-weight: 700; letter-spacing: .06em;
  }
  #boardTabs button.on { background: rgba(238,241,248,.16); }
  #boardTabs button:active { transform: scale(.95); }

  #board li.empty {
    display: block; text-align: center;
    color: rgba(238,241,248,.4); padding: 10px 0;
  }

  #tutBtn {
    pointer-events: auto; cursor: pointer;
    padding: 11px 20px; border-radius: 12px;
    border: 1px dashed rgba(238,241,248,.28);
    background: transparent; color: rgba(238,241,248,.68);
    font-family: inherit; font-size: 13px;
    display: none;
  }
  #tutBtn.show { display: block; }
  #tutBtn:active { transform: scale(.97); }

  #tutBar {
    position: absolute; left: 50%; top: 34%;
    transform: translateX(-50%);
    width: min(360px, calc(100% - 40px));
    background: rgba(12,16,26,.82); border-radius: 16px;
    padding: 18px 22px; backdrop-filter: blur(8px);
    color: #eef1f8; text-align: center;
    pointer-events: none;            /* 눌러서 넘길 수 있게 클릭을 통과시킨다 */
    opacity: 0; transition: opacity .2s;
  }
  #tutBar.show { opacity: 1; }
  #tutBar .msg { font-size: 15px; line-height: 1.6; }
  #tutBar .cue {
    margin-top: 12px; font-size: 13px; font-weight: 700;
    letter-spacing: .04em;
  }
  #tutBar .cue.action { color: #ffe27a; }
  #tutBar .cue.go { color: rgba(238,241,248,.5); }
  #tutBar .cue.watch { display: none; }
  #tutBar .cue.action { animation: cuePulse 1.1s ease-in-out infinite; }
  @keyframes cuePulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

  #tutSkip {
    position: absolute; left: 50%; bottom: 22px;
    transform: translateX(-50%);
    display: none; pointer-events: auto; cursor: pointer;
    padding: 9px 18px; border-radius: 999px; border: none;
    background: rgba(238,241,248,.12); color: rgba(238,241,248,.7);
    font-family: inherit; font-size: 12px;
    backdrop-filter: blur(4px);
  }
  #tutSkip.show { display: block; }

  @media (prefers-reduced-motion: reduce) {
    #tutBar .cue.action { animation: none; }
  }

  #diffPick {
    display: none; flex-wrap: wrap; gap: 8px; justify-content: center;
    pointer-events: auto; max-width: 330px;
  }
  #diffPick.show { display: flex; }
  #diffPick button {
    flex: 1 1 138px;
    padding: 10px 14px; border-radius: 12px; cursor: pointer;
    border: 2px solid rgba(238,241,248,.16);
    background: rgba(12,16,26,.55); color: #eef1f8;
    font-family: inherit; text-align: left; line-height: 1.3;
    backdrop-filter: blur(4px);
  }
  #diffPick button .dn { display: block; font-size: 14px; font-weight: 800; letter-spacing: .07em; }
  #diffPick button .dk { display: block; font-size: 11px; color: rgba(238,241,248,.5); margin-top: 1px; }
  #diffPick button.on { border-color: currentColor; background: rgba(238,241,248,.1); }
  #diffPick button:active { transform: scale(.97); }


  @media (prefers-reduced-motion: reduce) {
    #score.pop { transform: none; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="hudLeft">
      <div id="score">0</div>
      <div id="diffBadge"></div>
      <div id="scoreHelp">
        <div class="row"><span>착지</span><b>+1</b></div>
        <div class="row"><span>PERFECT</span><b>+1 +콤보</b></div>
        <div class="row next"><span>다음 PERFECT</span><b id="nextPts">+2</b></div>
      </div>
    </div>
    <div id="hudRight">
      <div id="best"><span id="bestDiff"></span> 최고 기록<strong id="bestNum">0</strong><span id="bestName"></span></div>
      <button id="muteBtn" title="소리 켜기/끄기">🔊</button>
    </div>
  </div>
  <div id="combo"></div>
  <div id="tutBar"><div class="msg"></div><div class="cue"></div></div>
  <button id="tutSkip">건너뛰기</button>
  <div id="overlay">
    <h1 id="ovTitle">STACKER</h1>
    <p id="ovMsg">탭 또는 스페이스로 블록을 쌓으세요</p>
    <div class="tag" id="ovTag">딱 맞게 쌓으면 콤보!</div>
    <div id="diffPick"></div>
    <button id="tutBtn">처음이신가요? 튜터리얼 →</button>
    <div id="entryBox">
      <input id="nameInput" maxlength="12" placeholder="이름을 입력하세요" autocomplete="off">
      <button id="saveBtn">기록 저장</button>
    </div>
    <div id="board" style="display:none">
      <div id="scopeTabs"></div>
      <div id="boardTabs"></div>
      <ol id="boardList"></ol>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('bestNum');
  const bestNameEl = document.getElementById('bestName');
  const bestDiffEl = document.getElementById('bestDiff');
  const comboEl = document.getElementById('combo');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovMsg = document.getElementById('ovMsg');
  const ovTag = document.getElementById('ovTag');
  const entryBox = document.getElementById('entryBox');
  const nameInput = document.getElementById('nameInput');
  const saveBtn = document.getElementById('saveBtn');
  const boardEl = document.getElementById('board');
  const boardList = document.getElementById('boardList');
  const muteBtn = document.getElementById('muteBtn');
  const diffBadge = document.getElementById('diffBadge');
  const diffPick = document.getElementById('diffPick');
  const nextPtsEl = document.getElementById('nextPts');
  const boardTabs = document.getElementById('boardTabs');
  const scopeTabs = document.getElementById('scopeTabs');
  const tutBtn = document.getElementById('tutBtn');
  const tutSkip = document.getElementById('tutSkip');
  const tutBar = document.getElementById('tutBar');
  const tutMsg = tutBar.querySelector('.msg');
  const tutCue = tutBar.querySelector('.cue');

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W, H, dpr;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  addEventListener('resize', resize);

  // ============ 난이도 ============
  // base/gain/cap = 블록 속도(층마다 gain씩 빨라지고 cap까지), tol = PERFECT 판정 px,
  // recover = PERFECT 시 블록 폭 회복 px. SKYLINE 이 기존 기본값이다.
  const DIFFS = [
    { key: 'seed',   name: 'SEED',   ko: '씨앗', base: 2.6, gain: 0.09, cap: 3.0, tol: 10, recover: 6, color: '#c2a878' },
    { key: 'sprout', name: 'SPROUT', ko: '새싹', base: 3.2, gain: 0.12, cap: 4.2, tol: 7,  recover: 4, color: '#7ee0a8' },
    { key: 'bloom',  name: 'BLOOM',  ko: '개화', base: 4.0, gain: 0.16, cap: 5.4, tol: 5,  recover: 2, color: '#ff8ec7' },
    { key: 'crown',  name: 'CROWN',  ko: '왕관', base: 5.0, gain: 0.20, cap: 6.8, tol: 3,  recover: 0, color: '#ffd166' },
  ];
  // 예전 이름으로 저장된 기록을 새 이름으로 옮긴다.
  const LEGACY = { foundation: 'seed', skyline: 'sprout', vertigo: 'bloom', babel: 'crown' };
  let diffIdx = 1;
  const D = () => DIFFS[diffIdx];

  // ============ 온라인 랭킹 (Supabase REST) ============
  // JS 클라이언트 라이브러리 없이 fetch 만 쓴다 — "외부 라이브러리 없음" 컨벤션 유지.
  // 아래 키는 공개용(publishable)이라 HTML 에 그대로 들어가도 된다. 실제 방어는 서버의
  // RLS 정책과 CHECK 제약(단계 이름, 점수 상한, 이름 길이)이 한다.
  // 네트워크가 어떤 이유로 막히든 게임과 로컬 기록은 그대로 돌아가야 한다.
  const API_URL = 'https://czefdonwmxldnxefsubh.supabase.co/rest/v1/scores';
  const API_KEY = 'sb_publishable_J7xd_-AgszYcyFJaX5qpKg_Nx-YDPzQ';
  const PLAYER_KEY = 'stacker-player-id';
  const TOP_N = 10;
  const FRESH_MS = 30000;          // 이 시간 안에 받아온 것은 다시 부르지 않는다

  let playerId = '';
  let scope = 'all';               // 'all' = 전체 랭킹, 'me' = 이 기기의 기록
  const online = {};               // 단계별 { state, rows, rank, at }

  const apiHeaders = () => ({ apikey: API_KEY, Authorization: `Bearer ${API_KEY}` });
  // 응답이 없으면 마냥 "불러오는 중" 에 머무르지 않고 실패로 떨어뜨려 내 기록을 보여준다
  const timeout = () => (AbortSignal.timeout ? AbortSignal.timeout(6000) : undefined);

  async function fetchTop(stage) {
    const q = `?stage=eq.${stage}&select=name,score,player_id&order=score.desc,created_at.asc&limit=${TOP_N}`;
    const r = await fetch(API_URL + q, { headers: apiHeaders(), signal: timeout() });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  // 내 점수보다 높은 기록이 몇 개인지 세어 순위를 낸다 (Content-Range: "0-0/123")
  async function fetchRank(stage, score) {
    const q = `?stage=eq.${stage}&score=gt.${score}&select=id`;
    const r = await fetch(API_URL + q, { headers: { ...apiHeaders(), Prefer: 'count=exact', Range: '0-0' }, signal: timeout() });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const total = parseInt((r.headers.get('content-range') || '').split('/')[1], 10);
    return Number.isFinite(total) ? total + 1 : null;
  }

  function loadOnline(stage) {
    // 저장소를 읽기 전(reset() 이 loadBoard() 보다 먼저 돈다)에는 부르지 않는다.
    // 그때는 boards 도 playerId 도 비어 있어 순위와 내 기록 표시가 빠진 채로 캐시된다.
    if (!playerId) return;
    const c = online[stage];
    // 받아오는 중이거나 아직 신선하면 다시 부르지 않는다. 실패한 것도 잠시 쉬었다 재시도해야
    // 렌더 → 실패 → 렌더가 무한히 도는 것을 막는다.
    if (c && (c.state === 'loading' || Date.now() - c.at < FRESH_MS)) return;
    online[stage] = { state: 'loading' };
    const mine = boardOf(stage)[0];
    Promise.all([fetchTop(stage), mine ? fetchRank(stage, mine.score).catch(() => null) : null])
      .then(([rows, rank]) => { online[stage] = { state: 'ok', rows, rank, at: Date.now() }; })
      .catch(() => { online[stage] = { state: 'error', at: Date.now() }; })
      .then(() => { if (viewKey === stage && scope === 'all') renderBoard(); });
  }

  // 제출은 게임을 막지 않는다 — 실패해도 로컬 기록은 이미 저장돼 있다
  function submitOnline(stage, name, score) {
    fetch(API_URL, {
      method: 'POST',
      headers: { ...apiHeaders(), 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({ stage, name, score, player_id: playerId }),
      signal: timeout(),
    }).then(() => {
      delete online[stage];                    // 새 기록이 보이도록 캐시를 버리고
      if (viewKey === stage && scope === 'all') renderBoard();   // 그 자리에서 다시 그린다
    }).catch(() => {});
  }

  // ============ 저장소 (리더보드) ============
  const BOARD_KEY = 'stacker-leaderboard';   // 예전 단일 보드 (읽기 전용, 이관용)
  const BOARDS_KEY = 'stacker-boards';       // 단계별 보드
  const NAME_KEY = 'stacker-lastname';
  const DIFF_KEY = 'stacker-difficulty';
  let memName = '';
  let boards = {};                 // { seed: [...], sprout: [...], ... }
  let viewKey = null;              // 리더보드에서 보고 있는 단계
  const boardOf = k => (boards[k] || (boards[k] = []));

  // 저장 어댑터: 아티팩트(window.storage) → localStorage(일반 브라우저) → 메모리 순 폴백
  const store = {
    async get(k) {
      if (window.storage && window.storage.get) {
        try { const r = await window.storage.get(k); return r ? r.value : null; } catch (e) { return null; }
      }
      try { return localStorage.getItem(k); } catch (e) { return null; }
    },
    async set(k, v) {
      if (window.storage && window.storage.set) {
        try { await window.storage.set(k, v); return; } catch (e) { return; }
      }
      try { localStorage.setItem(k, v); } catch (e) {}
    }
  };

  async function loadBoard() {
    boards = {};
    DIFFS.forEach(d => boards[d.key] = []);
    try {
      const raw = await store.get(BOARDS_KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      if (parsed) DIFFS.forEach(d => { if (Array.isArray(parsed[d.key])) boards[d.key] = parsed[d.key]; });
      else await migrateOldBoard();
    } catch (e) { /* 손상된 데이터는 빈 보드로 시작 */ }
    const n = await store.get(NAME_KEY);
    if (n) memName = n;
    playerId = (await store.get(PLAYER_KEY)) || '';
    if (!playerId) {
      playerId = (self.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : Date.now() + '-' + Math.random().toString(36).slice(2, 10);
      store.set(PLAYER_KEY, playerId);
    }

    const d = await store.get(DIFF_KEY);
    const di = DIFFS.findIndex(x => x.key === d);
    if (di >= 0) diffIdx = di;
    renderPick();
    updateDiffBadge();
    renderBoard();

    // 처음 온 사람에게는 자동으로 띄운다 — 기록도 선택도 없고 마친 적도 없을 때만
    const doneTut = await store.get(TUT_KEY);
    const noRecords = !DIFFS.some(x => boardOf(x.key).length);
    if (!doneTut && !d && noRecords && state === 'ready') tutStart();
  }

  // 단계 구분이 없던 시절의 기록을 옮긴다. 그때 기본 설정이 지금의 SPROUT 이므로
  // 단계 표시가 없는 기록은 SPROUT 로 본다. 예전 키(foundation 등)는 이름만 바뀐 것이다.
  async function migrateOldBoard() {
    let old;
    try { old = JSON.parse(await store.get(BOARD_KEY)); } catch (e) { return; }
    if (!Array.isArray(old)) return;
    for (const e of old) {
      const k = LEGACY[e.diff] || (boards[e.diff] ? e.diff : 'sprout');
      boardOf(k).push({ id: e.id, name: e.name, score: e.score });
    }
    DIFFS.forEach(d => trim(d.key));
    await store.set(BOARDS_KEY, JSON.stringify(boards));
  }

  function trim(k) {
    boards[k] = boardOf(k).sort((a, b) => b.score - a.score).slice(0, 5);
  }

  async function saveBoard() {
    trim(D().key);
    await store.set(BOARDS_KEY, JSON.stringify(boards));
    await store.set(NAME_KEY, memName);
  }

  // TOP 5 진입 여부는 지금 플레이한 단계 안에서만 따진다.
  function qualifies(s) {
    if (s <= 0) return false;
    const b = boardOf(D().key);
    if (b.length < 5) return true;
    return s > b[b.length - 1].score;
  }

  let lastEntryId = null;

  // 우측 상단 최고 기록: 지금 고른 단계의 1위 (단계마다 따로 센다)
  function updateBestHUD() {
    const top = boardOf(D().key)[0];
    const mine = bests[D().key] || 0;
    const shown = Math.max(mine, top ? top.score : 0);
    // 어느 단계의 기록인지 숫자 옆에서 바로 읽히게 한다 — 라벨이 "최고 기록" 뿐이면
    // 기본 선택인 쉬운 단계 점수가 게임 전체의 기록처럼 읽힌다.
    bestDiffEl.textContent = D().name;
    bestDiffEl.style.color = D().color;
    bestEl.textContent = shown > 0 ? shown : '—';
    bestNameEl.textContent = (top && top.score >= mine) ? top.name : '';
  }

  const row = (cls, rank, name, score) =>
    `<li class="${cls}"><span class="rank">${rank}</span>` +
    `<span class="nm">${escapeHtml(name)}</span><span class="sc">${score}</span></li>`;

  function renderBoard() {
    updateBestHUD();
    boardEl.style.display = 'block';    // 전체 랭킹이 있으니 내 기록이 없어도 보여준다
    if (!viewKey) viewKey = D().key;

    scopeTabs.innerHTML =
      `<button data-s="all" class="${scope === 'all' ? 'on' : ''}">전체</button>` +
      `<button data-s="me" class="${scope === 'me' ? 'on' : ''}">내 기록</button>`;

    boardTabs.innerHTML = DIFFS.map(d =>
      `<button data-k="${d.key}" class="${d.key === viewKey ? 'on' : ''}"
        style="${d.key === viewKey ? `color:${d.color}` : ''}">${d.name}</button>`).join('');

    if (scope === 'me') {
      const mine = boardOf(viewKey);
      boardList.innerHTML = mine.length
        ? mine.map((e, i) => row(e.id === lastEntryId ? 'me' : '', i + 1, e.name, e.score)).join('')
        : `<li class="empty">아직 기록이 없습니다</li>`;
      return;
    }

    loadOnline(viewKey);
    const c = online[viewKey];
    if (!c || c.state === 'loading') {
      boardList.innerHTML = `<li class="empty">불러오는 중…</li>`;
      return;
    }
    if (c.state === 'error') {
      // 못 불러왔다고 빈 화면을 보여주지 않는다 — 내 기록으로 대신한다
      const mine = boardOf(viewKey);
      boardList.innerHTML =
        `<li class="empty">전체 랭킹을 불러올 수 없어 내 기록을 보여줍니다</li>` +
        (mine.length
          ? mine.map((e, i) => row(e.id === lastEntryId ? 'me' : '', i + 1, e.name, e.score)).join('')
          : `<li class="empty">아직 기록이 없습니다</li>`);
      return;
    }
    // 이름은 다른 사람이 입력한 값이다 — 반드시 이스케이프한다
    let html = c.rows.length
      ? c.rows.map((e, i) => row(e.player_id === playerId ? 'mine' : '', i + 1, e.name, e.score)).join('')
      : `<li class="empty">아직 아무도 기록을 남기지 않았습니다</li>`;
    // 상위 목록에 내가 없으면 내 순위를 맨 아래에 고정한다
    const best = boardOf(viewKey)[0];
    if (best && c.rank && !c.rows.some(e => e.player_id === playerId)) {
      html += row('myrank', c.rank, '내 기록 · ' + best.name, best.score);
    }
    boardList.innerHTML = html;
  }

  scopeTabs.addEventListener('pointerdown', e => e.stopPropagation());
  scopeTabs.addEventListener('click', e => {
    e.stopPropagation();
    const btn = e.target.closest('button');
    if (!btn) return;
    scope = btn.dataset.s;
    renderBoard();
  });

  boardTabs.addEventListener('pointerdown', e => e.stopPropagation());
  boardTabs.addEventListener('click', e => {
    e.stopPropagation();
    const btn = e.target.closest('button');
    if (!btn) return;
    viewKey = btn.dataset.k;
    renderBoard();
  });
  // 선택 즉시 시작한다 — 'ready' 상태에서만 보인다.
  function renderPick() {
    diffPick.innerHTML = DIFFS.map((d, i) =>
      `<button data-i="${i}" class="${i === diffIdx ? 'on' : ''}" style="color:${d.color}">
        <span class="dn">${d.name}</span><span class="dk">${d.ko}</span>
      </button>`).join('');
  }

  diffPick.addEventListener('pointerdown', e => e.stopPropagation());
  diffPick.addEventListener('click', e => {
    e.stopPropagation();
    const btn = e.target.closest('button');
    if (!btn) return;
    diffIdx = +btn.dataset.i;
    reset();          // 새 난이도로 판을 다시 깐다 (선택 표시도 여기서 갱신)
    drop();           // 곧바로 시작 — 저장은 기다리지 않는다
    store.set(DIFF_KEY, D().key);
  });

  function updateDiffBadge() {
    diffBadge.textContent = D().name;
    diffBadge.style.color = D().color;
  }

  function updateHelp() {
    // 다음 PERFECT 는 콤보가 1 오른 뒤 1+콤보 점 → combo+2
    nextPtsEl.textContent = '+' + (combo + 2);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ============ 배경음악 (Web Audio 칩튠 시퀀서) ============
  let ac = null;
  let musicOn = true;
  let musicStarted = false;
  let noiseBuf = null;

  function ensureAudio() {
    if (!ac) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        // 노이즈 버퍼 (하이햇/스네어용)
        noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.3, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) {}
    }
    if (ac && ac.state === 'suspended') ac.resume();
  }

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  // Am - F - C - G (69=A4 기준 미디 노트)
  const CHORDS = [
    { root: 45, tones: [57, 60, 64] },  // Am: A3 C4 E4
    { root: 41, tones: [57, 60, 65] },  // F:  A3 C4 F4
    { root: 48, tones: [60, 64, 67] },  // C:  C4 E4 G4
    { root: 43, tones: [59, 62, 67] },  // G:  B3 D4 G4
  ];
  // 16스텝 리드 멜로디 (코드톤 인덱스, -1 = 쉼표, +12 = 옥타브 업 표시용 오브젝트)
  const LEAD_PAT = [
    [0,-1,1,-1, 2,-1,1,0, -1,1,-1,2, 3,2,1,-1],
    [0,-1,1,-1, 2,-1,3,-1, 2,-1,1,-1, 0,1,2,3],
  ];

  function playTone(freq, t, dur, type, vol) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function playNoise(t, dur, vol, hp) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(ac.destination);
    s.start(t); s.stop(t + dur + 0.02);
  }

  let step = 0, nextStepTime = 0, schedTimer = null;
  function tempoBPM() {
    // 층이 올라갈수록 살짝 빨라짐 (긴장감)
    const h = blocks ? blocks.length : 0;
    return 138 + Math.min(h, 40) * 0.6;
  }

  function scheduler() {
    if (!ac || !musicOn) return;
    const stepDur = 60 / tempoBPM() / 4; // 16분음표
    while (nextStepTime < ac.currentTime + 0.12) {
      scheduleStep(step, nextStepTime, stepDur);
      nextStepTime += stepDur;
      step = (step + 1) % 64; // 4마디 루프
    }
  }

  function scheduleStep(s, t, dur) {
    const bar = Math.floor(s / 16) % 4;
    const pos = s % 16;
    const chord = CHORDS[bar];
    const patIdx = Math.floor(s / 32) % LEAD_PAT.length;

    // 베이스 (triangle): 1,3박 루트 / 2,4박 5도
    if (pos % 4 === 0) {
      const note = (pos === 4 || pos === 12) ? chord.root + 7 : chord.root;
      playTone(mtof(note), t, dur * 3.2, 'triangle', 0.16);
    }
    // 리드 아르페지오 (square, 얇게)
    const li = LEAD_PAT[patIdx][pos];
    if (li >= 0) {
      const tone = chord.tones[li % 3] + (li >= 3 ? 12 : 0);
      playTone(mtof(tone + 12), t, dur * 1.6, 'square', 0.05);
    }
    // 하이햇: 8분음표 오프비트
    if (pos % 2 === 0) playNoise(t, 0.03, pos % 4 === 2 ? 0.09 : 0.05, 7000);
    // 스네어: 2,4박
    if (pos === 4 || pos === 12) playNoise(t, 0.09, 0.11, 1800);
    // 킥 (짧은 사인 스윕)
    if (pos === 0 || pos === 8) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(140, t);
      o.frequency.exponentialRampToValueAtTime(45, t + 0.09);
      g.gain.setValueAtTime(0.4, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 0.13);
    }
  }

  function startMusic() {
    ensureAudio();
    if (!ac || musicStarted) return;
    musicStarted = true;
    step = 0;
    nextStepTime = ac.currentTime + 0.05;
    schedTimer = setInterval(scheduler, 30);
  }
  function stopMusic() {
    musicStarted = false;
    if (schedTimer) { clearInterval(schedTimer); schedTimer = null; }
  }

  muteBtn.addEventListener('pointerdown', e => e.stopPropagation());
  muteBtn.addEventListener('click', e => {
    e.stopPropagation();
    musicOn = !musicOn;
    muteBtn.textContent = musicOn ? '🔊' : '🔇';
    if (musicOn && state === 'play') startMusic();
    if (!musicOn) stopMusic();
  });

  // ============ 효과음 ============
  // 음소거 버튼은 음악과 효과음을 함께 끈다.
  function sfxReady() {
    if (!musicOn) return false;
    ensureAudio();
    return !!ac;
  }

  function beep(freq, dur = 0.07, type = 'sine', gain = 0.12) {
    if (!sfxReady()) return;
    playTone(freq, ac.currentTime, dur, type, gain);
  }

  // 하강 스윕 — 킥/충격 공용
  function sweep(t, f0, f1, dur, vol, type = 'sine') {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.03);
  }

  // PERFECT — 콤보마다 반음씩 올라가는 상승 아르페지오 + 고역 반짝임
  function sfxPerfect(n) {
    if (!sfxReady()) return;
    const t = ac.currentTime;
    const base = 660 * Math.pow(2, Math.min(n - 1, 9) / 12);
    [0, 4, 7, 12].forEach((semi, i) => {
      playTone(base * Math.pow(2, semi / 12), t + i * 0.042, 0.3, 'triangle', 0.17 - i * 0.022);
    });
    playTone(base * 4, t + 0.13, 0.24, 'sine', 0.055);
    if (n >= 3) playNoise(t, 0.05, 0.05, 9000);   // 콤보가 붙으면 반짝임 추가
  }

  // 어긋난 착지 — 둔탁한 충격 + 잘려나가는 파편 노이즈
  function sfxCut() {
    if (!sfxReady()) return;
    const t = ac.currentTime;
    sweep(t, 330, 105, 0.17, 0.14, 'square');
    playNoise(t, 0.13, 0.1, 2400);
  }

  // 게임 오버 — 단조 3음 하강 후 바닥 충격
  function sfxGameOver() {
    if (!sfxReady()) return;
    const t = ac.currentTime;
    [0, -3, -8].forEach((semi, i) => {
      playTone(440 * Math.pow(2, semi / 12), t + i * 0.13, 0.52, 'sawtooth', 0.13);
    });
    sweep(t + 0.36, 180, 30, 0.62, 0.42);
    playNoise(t + 0.36, 0.55, 0.15, 400);
  }

  // ============ 게임 ============
  const BLOCK_H = 34;
  const BASE_W = () => Math.min(W * 0.62, 340);

  let state, blocks, mover, debris, rings, cam, camTarget;
  let score, combo, shake, hueBase, bgFlash;
  const bests = {};                // 이번 세션의 단계별 최고 점수
  let tut = null;                  // 튜터리얼 진행 중이면 { step, easy }
  let paused = false;              // 블록과 파편의 움직임을 멈춘다 (튜터리얼 설명용)

  function blockColor(i, l = 58) {
    return `hsl(${(hueBase + i * 7) % 360} 62% ${l}%)`;
  }

  function reset() {
    hueBase = Math.random() * 360;
    blocks = [];
    debris = [];
    rings = [];
    score = 0; combo = 0; shake = 0; bgFlash = 0;
    cam = 0; camTarget = 0;
    scoreEl.textContent = '0';
    const w = BASE_W();
    blocks.push({ x: (W - w) / 2, y: 0, w });
    spawnMover();
    state = 'ready';
    overlay.classList.remove('hidden');
    ovTitle.textContent = 'STACKER';
    ovMsg.textContent = '탭 또는 스페이스로 블록을 쌓으세요';
    ovTag.style.display = 'block';
    ovTag.textContent = '딱 맞게 쌓으면 콤보!';
    entryBox.classList.remove('show');
    viewKey = D().key;
    diffPick.classList.add('show');
    tutBtn.classList.add('show');
    renderPick();
    updateDiffBadge();
    updateHelp();
    renderBoard();
  }

  function spawnMover() {
    const top = blocks[blocks.length - 1];
    const layer = blocks.length;
    const fromLeft = layer % 2 === 1;
    const speed = D().base + Math.min(layer * D().gain, D().cap);
    mover = { w: top.w, x: fromLeft ? -top.w : W, dir: fromLeft ? 1 : -1, speed, layer, stopAt: undefined };
  }

  function layerScreenY(layer) {
    return H - 90 - (layer * BLOCK_H) + cam;
  }

  function drop() {
    if (state === 'entry') return; // 이름 입력 중엔 무시

    // 튜터리얼 — 설명을 읽는 중이면 누르기는 '넘기기'다 (블록을 놓지 않는다)
    if (tut) {
      if (musicOn && !musicStarted) startMusic();   // 자동 시작이었다면 여기서 소리를 연다
      if (tut.wait === 'go') { tutNext(); return; }
      // 흘러 들어오는 중이면 누르기는 블록을 놓는 게 아니라 '빨리 감기'다
      if (tut.wait === 'watch') { tutArrive(); return; }
      paused = false;
    }

    if (state === 'ready') {
      state = 'play';
      diffPick.classList.remove('show');
      tutBtn.classList.remove('show');
      overlay.classList.add('hidden');
      if (musicOn) startMusic();
      return;
    }
    if (state === 'over') { reset(); return; }
    if (state !== 'play') return;

    const top = blocks[blocks.length - 1];
    const delta = mover.x - top.x;
    const overlap = top.w - Math.abs(delta);

    if (overlap <= 0) {
      // 튜터리얼은 게임 오버로 끝나지 않는다 (이동 범위를 묶어 여기 오지 않지만 대비해 둔다)
      if (tut) { tutGo(tut.step); return; }
      debris.push({ x: mover.x, layer: mover.layer, w: mover.w, vy: 0, vx: mover.dir * 2, rot: 0, vr: (Math.random() - .5) * .2, color: blockColor(mover.layer) });
      gameOver();
      return;
    }

    const tol = (tut && tut.tol) || D().tol;   // 튜터리얼 구간은 자체 판정을 쓴다
    let perfect = false;
    if (Math.abs(delta) <= tol) {
      perfect = true;
      combo++;
      blocks.push({ x: top.x, y: mover.layer, w: Math.min(top.w + D().recover, BASE_W()) });
      rings.push({ x: top.x + top.w / 2, layer: mover.layer, r: 10, max: 90 + combo * 10, a: 1 });
      score += 1 + combo;
      bgFlash = 0.35;
      sfxPerfect(combo);
      showCombo(combo);
    } else {
      combo = 0;
      const newX = delta > 0 ? mover.x : top.x;
      const newW = overlap;
      blocks.push({ x: newX, y: mover.layer, w: newW });
      const cutW = Math.abs(delta);
      const cutX = delta > 0 ? newX + newW : mover.x;
      debris.push({ x: cutX, layer: mover.layer, w: cutW, vy: 0, vx: delta > 0 ? 1.5 : -1.5, rot: 0, vr: (Math.random() - .5) * .15, color: blockColor(mover.layer) });
      score += 1;
      sfxCut();
    }

    scoreEl.textContent = score;
    updateHelp();
    scoreEl.classList.remove('pop'); void scoreEl.offsetWidth; scoreEl.classList.add('pop');

    camTarget = Math.max(0, (blocks.length - 6) * BLOCK_H);
    spawnMover();
    if (tut) tutAfterDrop(perfect);
  }

  function showCombo(n) {
    comboEl.textContent = n >= 2 ? `PERFECT ×${n}` : 'PERFECT!';
    comboEl.classList.remove('show'); void comboEl.offsetWidth; comboEl.classList.add('show');
  }

  function gameOver() {
    stopMusic();
    shake = reduceMotion ? 0 : 14;
    sfxGameOver();
    if (score > (bests[D().key] || 0)) bests[D().key] = score;

    overlay.classList.remove('hidden');
    ovTitle.innerHTML = `<span class="final">${score}</span>`;
    ovTag.style.display = 'none';
    diffPick.classList.remove('show');
    tutBtn.classList.remove('show');

    if (qualifies(score)) {
      state = 'entry';
      ovMsg.innerHTML = `<span class="newbest">🏆 TOP 5 진입!</span> 이름을 남겨주세요`;
      entryBox.classList.add('show');
      nameInput.value = memName || '';
      setTimeout(() => nameInput.focus(), 50);
    } else {
      state = 'over';
      ovMsg.textContent = '탭해서 다시 도전';
    }
    renderBoard();
  }

  async function submitName() {
    if (state !== 'entry') return;
    const name = (nameInput.value.trim() || '익명').slice(0, 12);
    memName = name;
    lastEntryId = Date.now() + '-' + Math.random().toString(36).slice(2, 6);
    viewKey = D().key;             // 방금 세운 기록이 있는 탭을 보여준다
    boardOf(D().key).push({ id: lastEntryId, name, score });
    await saveBoard();
    submitOnline(D().key, name, score);
    entryBox.classList.remove('show');
    state = 'over';
    ovMsg.textContent = '탭해서 다시 도전';
    renderBoard();
    beep(660, 0.1, 'triangle', 0.14);
  }

  // ============ 튜터리얼 ============
  // 블록 3개로 잘림 → PERFECT → 콤보를 차례로 보여준다. SEED 기준으로 진행하고,
  // 어떤 경우에도 게임 오버로 끝나거나 빠져나갈 수 없는 상태가 되지 않는다.
  const TUT_KEY = 'stacker-tutorial-done';
  const isTouch = matchMedia('(hover: none)').matches;
  const PRESS = isTouch ? '화면을 탭' : '클릭(또는 스페이스바)';
  let tutTimer = null;

  const topBlock = () => blocks[blocks.length - 1];

  function tutSay(kind, msg, cue) {
    tut.wait = kind;                       // 'action' = 블록을 놓는다, 'go' = 설명을 넘긴다
    tutMsg.textContent = msg;
    tutCue.textContent = cue;
    tutCue.className = 'cue ' + kind;
    tutBar.classList.add('show');
  }

  // 블록이 실제 속도로 흘러 들어오는 모습을 보여주다가 지정한 자리에서 멈춘다.
  // 기다리기 답답하면 눌러서 건너뛸 수 있다 (tutArrive).
  function tutGlide(x, msg, onStop) {
    paused = false;
    tut.tol = null;
    tut.onStop = onStop;
    mover.minX = mover.maxX = undefined;
    // 실제 게임처럼 화면 밖에서 들어오게 한다. 앞 단계에서 멈춘 자리에서 출발하면
    // 목표가 코앞이라 움직임이 보이지 않는다 (C 단계가 62px, 0.4초밖에 안 됐다).
    mover.x = -mover.w;
    mover.dir = 1;
    mover.stopAt = x;
    tutSay('watch', msg, '');
  }

  // 목표 지점에 닿았다 — 세우고 안내를 띄운다
  function tutArrive() {
    if (!mover || mover.stopAt === undefined) return;
    mover.x = mover.stopAt;
    mover.stopAt = undefined;
    paused = true;
    const f = tut.onStop;
    tut.onStop = null;
    if (f) f();
  }

  // 아주 느리게, 탑 주변 half 픽셀 안에서만 왕복시킨다.
  // half 가 블록 폭보다 작으므로 겹침이 항상 남아 완전히 빗나갈 수 없다.
  // tol 은 이 구간에서만 쓰는 PERFECT 판정 — 실제 게임(SEED 10px)보다 너그럽게 준다.
  function tutCrawl(half, tol) {
    paused = false;
    const top = topBlock();
    tut.tol = tol;
    mover.speed = 0.7;
    mover.minX = top.x - half;
    mover.maxX = top.x + half;
    mover.x = mover.minX;
    mover.dir = 1;
  }

  function tutGo(step) {
    clearTimeout(tutTimer);
    tut.step = step;
    const top = topBlock();

    if (step === 'A') {
      // 판정에서 벗어난 자리에 세운다 — 잘려나갈 조각이 눈에 띌 만큼
      tutGlide(top.x + D().tol + 45,
        '움직이는 블록을 아래 탑에 쌓는 게임입니다. 블록은 이렇게 좌우로 움직입니다.',
        () => tutSay('action',
          '설명을 위해 여기서 멈췄습니다. 탑과 조금 어긋난 자리입니다.',
          `${PRESS}해서 블록을 놓아보세요`));
    }
    else if (step === 'B') {
      mover.x = -mover.w - 20;
      tutSay('go',
        '탑과 겹치지 않은 부분은 이렇게 잘려 떨어집니다. 블록이 그만큼 좁아졌습니다.',
        '눌러서 계속');
    }
    else if (step === 'C') {
      tutGlide(top.x,                       // 정확히 맞는 자리
        '이번엔 탑과 정확히 겹치는 자리에서 멈춥니다.',
        () => tutSay('action',
          '딱 맞는 자리입니다.',
          `${PRESS}해보세요`));
    }
    else if (step === 'D') {
      tutSay('go',
        'PERFECT! 딱 맞추면 잘리지 않을 뿐 아니라, 블록이 오히려 조금 넓어집니다.',
        '눌러서 계속');
    }
    else if (step === 'E') {
      tutCrawl(70, 20);
      tutSay('action',
        'PERFECT를 연달아 내면 콤보입니다. 이번엔 멈추지 않습니다 — 대신 아주 느리게 갑니다.',
        '타이밍을 맞춰 누르세요');
    }
    else if (step === 'E2') {
      tutCrawl(70, 20);
      tutSay('action',
        '빗나가면 콤보가 끊깁니다. 왼쪽 위 "다음 PERFECT" 점수가 되돌아간 것이 보이시나요?',
        '한 번 더 해보세요');
    }
    else if (step === 'E3') {
      tutCrawl(36, 46);                     // 이동 범위(±36)가 판정(46)보다 좁아 반드시 성공한다
      tutSay('action',
        '이번엔 판정을 넉넉하게 해 두었습니다. 편하게 눌러보세요.',
        `${PRESS}하세요`);
    }
    else if (step === 'F') {
      tutSay('go', combo > 0
        ? `연속 ${combo}번째 PERFECT라 ${1 + combo}점을 받았습니다. 콤보가 이어질수록 한 번에 얻는 점수가 커지고, 끊기면 다시 1부터입니다.`
        : '콤보는 PERFECT를 연달아 낼 때마다 점수가 1점씩 커지는 구조입니다. 실제 게임에서 노려보세요.',
        '눌러서 마치기');
    }
  }

  // 설명(go)을 넘길 때
  function tutNext() {
    tutBar.classList.remove('show');
    paused = false;
    if (tut.step === 'B') tutGo('C');
    else if (tut.step === 'D') tutGo('E');
    else if (tut.step === 'F') tutEnd();
  }

  // 블록을 놓은 직후 — 잠깐 흐르게 두었다가 멈추고 설명한다
  function tutAfterDrop(perfect) {
    tutBar.classList.remove('show');
    tut.wait = null;
    tut.tol = null;
    const hold = (ms, step) => { tutTimer = setTimeout(() => { paused = true; tutGo(step); }, ms); };

    // 파편이 화면 밖으로 나가기 전에 멈춘다. 낙하는 가속이 붙어(프레임당 vy += 0.6)
    // 430ms 면 이미 200px 넘게 떨어져 화면 아래로 사라진다.
    if (tut.step === 'A') hold(200, 'B');
    else if (tut.step === 'C') hold(520, 'D');
    else if (perfect) hold(520, 'F');
    else if (tut.step === 'E') tutTimer = setTimeout(() => tutGo('E2'), 700);
    else if (tut.step === 'E2') tutTimer = setTimeout(() => tutGo('E3'), 700);
    else hold(520, 'F');                             // E3까지 놓쳤으면 더 붙잡지 않는다
  }

  function tutStart() {
    diffIdx = 0;                    // 튜터리얼은 SEED 기준 (판정이 가장 넉넉하다)
    reset();
    tut = { step: null, wait: null, tol: null };
    state = 'play';
    overlay.classList.add('hidden');
    diffPick.classList.remove('show');
    tutBtn.classList.remove('show');
    tutSkip.classList.add('show');
    tutGo('A');
  }

  function tutEnd() {
    clearTimeout(tutTimer);
    tut = null;
    paused = false;
    tutBar.classList.remove('show');
    tutSkip.classList.remove('show');
    store.set(TUT_KEY, '1');
    store.set(DIFF_KEY, D().key);
    reset();
    ovMsg.textContent = '이제 직접 해볼까요? 단계를 고르세요';
  }

  tutBtn.addEventListener('pointerdown', e => e.stopPropagation());
  tutBtn.addEventListener('click', e => { e.stopPropagation(); tutStart(); });
  tutSkip.addEventListener('pointerdown', e => e.stopPropagation());
  tutSkip.addEventListener('click', e => { e.stopPropagation(); tutEnd(); });

  entryBox.addEventListener('pointerdown', e => e.stopPropagation());
  saveBtn.addEventListener('click', submitName);
  nameInput.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.code === 'Enter') submitName();
  });

  // ============ 입력 ============
  addEventListener('pointerdown', drop);
  addEventListener('keydown', e => {
    if (state === 'entry') return;
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); drop(); }
  });

  // ============ 루프 ============
  // dt = 60fps 기준으로 환산한 이번 프레임의 길이. 화면 주사율이 달라도 같은
  // 속도로 움직이게 한다 — 프레임당 고정 거리로 움직이면 120Hz 화면에서 블록이
  // 두 배 빨라져, 전체 랭킹에서 사람마다 다른 게임을 하는 셈이 된다.
  // 탭을 다시 열었을 때 dt 가 크게 튀어 블록이 순간이동하지 않도록 상한을 둔다.
  let lastT = 0;
  function frame(now) {
    if (now === undefined) now = performance.now();
    const dt = lastT ? Math.max(0, Math.min((now - lastT) / (1000 / 60), 3)) : 1;
    lastT = now;

    const flash = Math.max(0, bgFlash); bgFlash *= Math.pow(0.9, dt);
    const bgHue = (hueBase + blocks.length * 2) % 360;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `hsl(${bgHue} 30% ${10 + flash * 20}%)`);
    g.addColorStop(1, `hsl(${(bgHue + 40) % 360} 35% ${16 + flash * 20}%)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    cam += (camTarget - cam) * (1 - Math.pow(1 - 0.08, dt));
    let sx = 0, sy = 0;
    if (shake > 0.5) {
      sx = (Math.random() - .5) * shake;
      sy = (Math.random() - .5) * shake;
      shake *= Math.pow(0.88, dt);
    }
    ctx.save();
    ctx.translate(sx, sy);

    for (const b of blocks) {
      const y = layerScreenY(b.y);
      if (y < -BLOCK_H || y > H + BLOCK_H) continue;
      ctx.fillStyle = blockColor(b.y);
      ctx.fillRect(b.x, y, b.w, BLOCK_H - 2);
      ctx.fillStyle = 'rgba(255,255,255,.14)';
      ctx.fillRect(b.x, y, b.w, 5);
    }

    if (state === 'play' || state === 'ready') {
      if (!paused) {
        // 튜터리얼에서는 탑 주변으로 이동 범위를 묶어 완전히 빗나가는 일을 막는다
        const loX = mover.minX !== undefined ? mover.minX : -20;
        const hiX = mover.maxX !== undefined ? mover.maxX : W + 20 - mover.w;
        mover.x += mover.dir * mover.speed * dt;
        // 튜터리얼에서 세우기로 한 자리에 닿았으면 딱 맞춰 멈춘다
        if (mover.stopAt !== undefined &&
            (mover.dir > 0 ? mover.x >= mover.stopAt : mover.x <= mover.stopAt)) {
          tutArrive();
        } else {
          if (mover.x < loX) { mover.x = loX; mover.dir = 1; }
          if (mover.x > hiX) { mover.x = hiX; mover.dir = -1; }
        }
      }
      const y = layerScreenY(mover.layer);
      ctx.fillStyle = blockColor(mover.layer, 66);
      ctx.fillRect(mover.x, y, mover.w, BLOCK_H - 2);
      ctx.fillStyle = 'rgba(255,255,255,.22)';
      ctx.fillRect(mover.x, y, mover.w, 5);
    }

    for (let i = debris.length - 1; i >= 0; i--) {
      const d = debris[i];
      if (!paused) {
        d.vy += 0.6 * dt; d.rot += d.vr * dt;
        d.fall = (d.fall || 0) + d.vy * dt;
        d.x += d.vx * dt;
      }
      const y = layerScreenY(d.layer) + (d.fall || 0);
      ctx.save();
      ctx.translate(d.x + d.w / 2, y + BLOCK_H / 2);
      ctx.rotate(d.rot);
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = d.color;
      ctx.fillRect(-d.w / 2, -BLOCK_H / 2, d.w, BLOCK_H - 2);
      ctx.restore();
      if (!paused && y > H + 80) debris.splice(i, 1);
    }

    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i];
      r.r += (r.max - r.r) * (1 - Math.pow(1 - 0.15, dt));
      r.a *= Math.pow(0.92, dt);
      ctx.strokeStyle = `rgba(255,226,122,${r.a})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(r.x, layerScreenY(r.layer) + BLOCK_H / 2, r.r, 0, Math.PI * 2);
      ctx.stroke();
      if (r.a < 0.03) rings.splice(i, 1);
    }

    ctx.restore();
    requestAnimationFrame(frame);
  }

  reset();
  loadBoard();
  frame();
})();
</script>
</body>
</html>
